name: Feature proposal
description: Propose a scoped improvement
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: User problem
    validations:
      required: true
  - type: textarea
    id: outcome
    attributes:
      label: Smallest measurable outcome
    validations:
      required: true
  - type: textarea
    id: exclusions
    attributes:
      label: Explicit non-goals

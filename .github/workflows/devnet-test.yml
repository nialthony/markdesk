name: devnet-test

# Real devnet deployment and two-wallet acceptance test.
#
# Identities live in .devnet/ (committed): they are devnet-only throwaway
# keypairs with no real value. The deploy payer is funded ONCE by a human via
# the web faucet (https://faucet.solana.com — its quota is separate from the
# CLI faucet, which rate-limits shared runner IPs). The program keypair is
# stable so re-runs upgrade the same program instead of paying rent for a new
# one every run.
#
# Each run: sync declare_id! from the stable program id, build the SBF
# artifact, (re)deploy to devnet, bootstrap the protocol (idempotent — reuses
# the mints and config, publishes a fresh mark), and run the create -> fill ->
# cancel flow check with two wallets. Run logs are posted as comments on the
# anchor issue (#1) so they stay readable without actions blob-storage access.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/**

permissions:
  contents: read
  issues: write

concurrency:
  group: devnet-test
  cancel-in-progress: false

jobs:
  devnet:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      MARKDESK_KEYS_DIR: .devnet
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: devnet-sbf

      - name: Install Agave CLI 3.0.7
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.0.7/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Sync the declared program id
        run: |
          mkdir -p target/deploy
          cp .devnet/program.json target/deploy/markdesk-keypair.json
          PROGRAM_ID="$(solana-keygen pubkey target/deploy/markdesk-keypair.json)"
          echo "PROGRAM_ID=$PROGRAM_ID" >> "$GITHUB_ENV"
          DECLARED="$(grep -o 'declare_id!("[^"]*")' programs/markdesk/src/lib.rs | head -1 | cut -d'"' -f2)"
          echo "declared id in source: $DECLARED -> $PROGRAM_ID"
          sed -i "s/$DECLARED/$PROGRAM_ID/g" programs/markdesk/src/lib.rs Anchor.toml
          grep -n "declare_id!" programs/markdesk/src/lib.rs
          grep -n "markdesk = " Anchor.toml

      - name: Check the deploy payer balance
        env:
          RPC_URL: https://api.devnet.solana.com
          PAYER_KEY: .devnet/markdesk-payer.json
        run: |
          set -euo pipefail
          exec > >(tee funding.log) 2>&1
          solana config set --url devnet >/dev/null
          PAYER_PUB="$(solana-keygen pubkey "$PAYER_KEY")"
          echo "PAYER_PUB=$PAYER_PUB" >> "$GITHUB_ENV"
          echo "payer (persistent): $PAYER_PUB"

          balance() {
            for t in 1 2 3; do
              local v
              v="$(curl -s --max-time 10 "$RPC_URL" -X POST -H 'content-type: application/json' \
                -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getBalance\",\"params\":[\"$1\"]}" \
                | jq -r '.result.value // empty' || true)"
              if [ -n "$v" ] && [ "$v" != "null" ]; then
                echo "$v"
                return 0
              fi
              sleep 3
            done
            solana balance "$1" --url devnet --output json 2>/dev/null | jq -r '.lamports // 0'
          }

          # A first deploy pays rent for the buffer AND the program account
          # (~5 SOL peak); a redeploy of the existing program only needs the
          # buffer (~2.5 SOL, returned when it is closed).
          if solana program show "$PROGRAM_ID" >/dev/null 2>&1; then
            TARGET_LAMPORTS=2700000000
            echo "program $PROGRAM_ID already deployed: buffer-only redeploy"
          else
            TARGET_LAMPORTS=5200000000
            echo "program $PROGRAM_ID not deployed yet: full deploy"
          fi
          echo "TARGET_LAMPORTS=$TARGET_LAMPORTS" >> "$GITHUB_ENV"

          # Best-effort top-up: the shared-IP rate limit is amount-based, so
          # small requests sometimes pass where 2 SOL requests are refused.
          for i in $(seq 1 6); do
            CUR="$(balance "$PAYER_PUB")"
            echo "[airdrop $i] payer balance: $CUR / $TARGET_LAMPORTS"
            if [ "${CUR:-0}" -ge "$TARGET_LAMPORTS" ]; then
              echo "payer is funded"
              exit 0
            fi
            AMOUNT=1
            if [ "$i" -gt 3 ]; then AMOUNT=0.5; fi
            solana airdrop "$AMOUNT" "$PAYER_PUB" || echo "[airdrop $i] airdrop $AMOUNT refused"
            sleep 20
          done

          CUR="$(balance "$PAYER_PUB")"
          echo "final payer balance: $CUR / $TARGET_LAMPORTS"
          if [ "${CUR:-0}" -lt "$TARGET_LAMPORTS" ]; then
            echo "::error::Devnet payer $PAYER_PUB is underfunded ($CUR lamports, needs $TARGET_LAMPORTS). Open https://faucet.solana.com, pick devnet, and airdrop to that address (web-faucet quota is separate from the CLI faucet). The payer needs ~5.2 SOL for a first deploy or ~2.7 SOL for a redeploy. Then re-run this workflow."
            exit 1
          fi

      - name: Build the SBF program
        run: |
          cargo build-sbf \
            --manifest-path programs/markdesk/Cargo.toml \
            --tools-version v1.54 \
            --force-tools-install \
            -- \
            --locked
          ls -l target/deploy/

      - name: Deploy the program to devnet
        run: |
          solana program deploy target/deploy/markdesk.so \
            --program-id target/deploy/markdesk-keypair.json 2>&1 | tee deploy.log
          solana program show "$PROGRAM_ID"

      - name: Bootstrap the protocol
        run: npm run devnet:bootstrap -- --program "$PROGRAM_ID" 2>&1 | tee bootstrap.log

      - name: Two-wallet flow check
        run: npm run devnet:flow-check -- --program "$PROGRAM_ID" 2>&1 | tee flow-check.log

      - name: Post run logs to the anchor issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: "1"
        run: |
          {
            echo "### devnet-test run ${GITHUB_RUN_ID}"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Program: \`${PROGRAM_ID:-unknown}\`"
            echo "- Payer: \`${PAYER_PUB:-unknown}\`"
            echo "- Job status: ${{ job.status }}"
            echo ""
            for f in funding.log deploy.log bootstrap.log flow-check.log; do
              if [ -f "$f" ]; then
                echo "<details><summary><code>$f</code></summary>"
                echo ""
                echo '```'
                tail -c 12000 "$f"
                echo ""
                echo '```'
                echo "</details>"
                echo ""
              fi
            done
          } > comment.md
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -d "{\"body\": $(jq -Rs . comment.md)}" | jq -r '.html_url // "comment failed"'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devnet-run-logs
          path: |
            funding.log
            deploy.log
            bootstrap.log
            flow-check.log
            var/state/devnet.json
          if-no-files-found: ignore

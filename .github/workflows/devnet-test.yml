name: devnet-test

# Real devnet deployment and two-wallet acceptance test.
#
# The runner generates a fresh program keypair, syncs declare_id!, builds the
# SBF artifact, deploys to devnet, bootstraps the protocol, and runs the
# create -> fill -> cancel flow check. The deployed program id is printed in
# the run summary; the program keypair is intentionally NOT persisted (this is
# a one-shot test deployment, never a key-handling surface).
#
# Run logs are posted as comments on the anchor issue so they can be read
# without log-download access to the actions blob storage.

on:
  workflow_dispatch:
  push:
    branches:
      - arena/**

permissions:
  contents: read
  issues: write

concurrency:
  group: devnet-test
  cancel-in-progress: false

jobs:
  devnet:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: devnet-sbf

      - name: Install Agave CLI 3.0.7
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.0.7/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      - name: Generate the program keypair and sync the declared id
        run: |
          mkdir -p target/deploy var/keys
          solana-keygen new -o target/deploy/markdesk-keypair.json --no-bip39-passphrase --force
          PROGRAM_ID="$(solana-keygen pubkey target/deploy/markdesk-keypair.json)"
          echo "PROGRAM_ID=$PROGRAM_ID" >> "$GITHUB_ENV"
          DECLARED="$(grep -o 'declare_id!("[^"]*")' programs/markdesk/src/lib.rs | head -1 | cut -d'"' -f2)"
          echo "declared id in source: $DECLARED -> $PROGRAM_ID"
          sed -i "s/$DECLARED/$PROGRAM_ID/g" programs/markdesk/src/lib.rs Anchor.toml
          grep -n "declare_id!" programs/markdesk/src/lib.rs
          grep -n "markdesk = " Anchor.toml

      - name: Fund the deploy payer
        env:
          RPC_URL: https://api.devnet.solana.com
          TARGET_LAMPORTS: "5200000000"
        run: |
          set -euo pipefail
          exec > >(tee funding.log) 2>&1
          solana config set --url devnet >/dev/null
          PAYER=var/keys/markdesk-payer.json
          solana-keygen new -o "$PAYER" --no-bip39-passphrase --force >/dev/null
          PAYER_PUB="$(solana-keygen pubkey "$PAYER")"
          echo "PAYER_PUB=$PAYER_PUB" >> "$GITHUB_ENV"
          solana config set --keypair "$PAYER" >/dev/null
          echo "payer: $PAYER_PUB target: $TARGET_LAMPORTS"

          balance() {
            for t in 1 2 3; do
              local v
              v="$(curl -s --max-time 10 "$RPC_URL" -X POST -H 'content-type: application/json' \
                -d "{\"jsonrpc\":\"2.0\",\"id\":1,\"method\":\"getBalance\",\"params\":[\"$1\"]}" \
                | jq -r '.result.value // empty' || true)"
              if [ -n "$v" ] && [ "$v" != "null" ]; then
                echo "$v"
                return 0
              fi
              sleep 3
            done
            solana balance "$1" --url devnet --output json 2>/dev/null | jq -r '.lamports // 0'
          }

          # Direct airdrops first (faucets are async and rate limited).
          for i in $(seq 1 8); do
            CUR="$(balance "$PAYER_PUB")"
            echo "[direct $i] payer balance: $CUR"
            if [ "${CUR:-0}" -ge "$TARGET_LAMPORTS" ]; then exit 0; fi
            solana airdrop 2 "$PAYER_PUB" || echo "[direct $i] airdrop failed"
            sleep 15
          done

          # Fallback: fund donor wallets and consolidate into the payer.
          mkdir -p var/donors
          for round in $(seq 1 8); do
            CUR="$(balance "$PAYER_PUB")"
            echo "[donor $round] payer balance: $CUR"
            if [ "${CUR:-0}" -ge "$TARGET_LAMPORTS" ]; then exit 0; fi
            DONOR="var/donors/d$round.json"
            solana-keygen new -o "$DONOR" --no-bip39-passphrase --force >/dev/null
            DPUB="$(solana-keygen pubkey "$DONOR")"
            for try in 1 2 3; do
              if solana airdrop 2 "$DPUB"; then break; fi
              echo "[donor $round] airdrop try $try failed"
              sleep 15
            done
            solana transfer --keypair "$DONOR" "$PAYER_PUB" 1.9 \
              --allow-unfunded-recipient || echo "[donor $round] transfer failed"
            sleep 6
          done

          CUR="$(balance "$PAYER_PUB")"
          echo "final payer balance: $CUR"
          test "${CUR:-0}" -ge "$TARGET_LAMPORTS"

      - name: Build the SBF program
        run: |
          cargo build-sbf \
            --manifest-path programs/markdesk/Cargo.toml \
            --tools-version v1.54 \
            --force-tools-install \
            -- \
            --locked
          ls -l target/deploy/

      - name: Deploy the program to devnet
        run: |
          solana program deploy target/deploy/markdesk.so \
            --program-id target/deploy/markdesk-keypair.json 2>&1 | tee deploy.log
          solana program show "$PROGRAM_ID"

      - name: Bootstrap the protocol
        run: npm run devnet:bootstrap -- --program "$PROGRAM_ID" 2>&1 | tee bootstrap.log

      - name: Two-wallet flow check
        run: npm run devnet:flow-check -- --program "$PROGRAM_ID" 2>&1 | tee flow-check.log

      - name: Post run logs to the anchor issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: "1"
        run: |
          {
            echo "### devnet-test run ${GITHUB_RUN_ID}"
            echo ""
            echo "- Commit: ${GITHUB_SHA}"
            echo "- Program: \`${PROGRAM_ID:-unknown}\`"
            echo "- Payer: \`${PAYER_PUB:-unknown}\`"
            echo "- Job status: ${{ job.status }}"
            echo ""
            for f in funding.log deploy.log bootstrap.log flow-check.log; do
              if [ -f "$f" ]; then
                echo "<details><summary><code>$f</code></summary>"
                echo ""
                echo '```'
                tail -c 12000 "$f"
                echo ""
                echo '```'
                echo "</details>"
                echo ""
              fi
            done
          } > comment.md
          curl -s -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/${ISSUE_NUMBER}/comments" \
            -d "{\"body\": $(jq -Rs . comment.md)}" | jq -r '.html_url // "comment failed"'

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: devnet-run-logs
          path: |
            funding.log
            deploy.log
            bootstrap.log
            flow-check.log
            var/state/devnet.json
          if-no-files-found: ignore

name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run format:check
      - run: npm run build

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo test -p markdesk
      - run: cargo clippy -p markdesk --all-targets -- -D warnings

  validator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: validator
      - name: Install Agave SBF tooling
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/v3.0.7/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - run: cargo fmt --manifest-path tests/validator/Cargo.toml -- --check
      - run: cargo build-sbf --manifest-path programs/markdesk/Cargo.toml --tools-version v1.54 --force-tools-install -- --locked
      - run: CARGO_TARGET_DIR="$PWD/target" cargo test --manifest-path tests/validator/Cargo.toml --locked
      - run: CARGO_TARGET_DIR="$PWD/target" cargo clippy --manifest-path tests/validator/Cargo.toml --all-targets --locked -- -D warnings

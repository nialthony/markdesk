[package]
name = "markdesk"
version = "0.1.0"
description = "Mark-relative OTC settlement for PreStocks on Solana"
edition = "2021"
license = "MIT"

[package.metadata.solana]
tools-version = "v1.54"

[lib]
crate-type = ["cdylib", "lib"]
name = "markdesk"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "1.2.0", features = ["init-if-needed"] }
anchor-spl = { version = "1.2.0", features = ["associated_token", "token_2022", "token_2022_extensions"] }
